name: Runtime acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked environment
        shell: bash
        run: |
          python -m pip install uv==0.12.10
          uv sync --frozen --python 3.12 --managed-python
      - name: Verify macOS runner and canonical temporary path
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          printf 'TMPDIR=%s\n' "$(cd "$RUNNER_TEMP" && pwd -P)" >> "$GITHUB_ENV"
      - name: Use the Windows runner's long-form temporary path
        if: runner.os == 'Windows'
        shell: bash
        run: printf 'TMPDIR=%s\n' "$(cygpath -am "$RUNNER_TEMP")" >> "$GITHUB_ENV"
      - name: Regressions and real retrieval
        shell: bash
        run: |
          uv run --frozen --python 3.12 python -m unittest discover
          uv run --frozen --python 3.12 python runtime_acceptance.py
