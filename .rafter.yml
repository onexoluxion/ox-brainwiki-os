# Rafter policy for this package. Review exclusions for the intended project.

version: "1"

risk_level: moderate   # minimal | moderate | aggressive

command_policy:
  # allow-all | approve-dangerous | deny-list
  mode: approve-dangerous

  # Policy arrays can replace inherited rules. Review the effective policy
  # before adding a local list; retain the global safeguards.
  # blocked_patterns: []
  # require_approval: []

scan:
  # Explicit exclusions for installed dependencies, generated state and output.
  exclude_paths:
    - ".venv"
    - ".state"
    - ".state-secure"
    - "__pycache__"
    # Integrity hashes can resemble secrets; review findings before excluding.
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "yarn.lock"
    # Compiled/generated output that is not source of truth.
    - "*.node"
    - "*.dll"
    # Verify matching behavior with the installed scanner before extending.
    - ".next"
    - "dist"
    - "build"
    - "coverage"
    # Saved MIME content can contain encoded data that resembles credentials.
    - "*.eml"
    - "*.msg"
    # Keep HTML scanned. Review any encoded-image false positive individually.

  # ADDED to Rafter's built-in patterns, never a replacement.
  # Credential shapes worth detecting everywhere.
  custom_patterns:
    - name: "Amazon SP-API refresh token"
      regex: "Atzr\\|[A-Za-z0-9_\\-]{100,}"
      severity: critical
    - name: "Amazon LWA client secret"
      regex: "amzn1\\.oa2-cs\\.v1\\.[a-f0-9]{64}"
      severity: critical

audit:
  retention_days: 90
  log_level: info

# After copying, ALWAYS run `rafter secrets .` once and triage every finding
# before trusting a clean result. A scan that has never returned a true
# positive has not been shown to work — it has only been shown to be quiet.
